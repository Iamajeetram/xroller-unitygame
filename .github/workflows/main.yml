name: Check Unity Build

on:
  workflow_dispatch:

jobs:
  check:
    name: Check Unity 2017.4.0f1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show Unity version
        run: cat ProjectSettings/ProjectVersion.txt

      - name: Check Build Settings
        run: cat ProjectSettings/EditorBuildSettings.asset

      - name: Prepare Unity build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: auto
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: xRollerBall
